{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

  <title>{% block title %}Household Chores{% endblock %}</title>
  <script src="{% static 'chores/htmx.min.js' %}"></script>
</head>
<body>
  <nav>
    <a href="{% url 'this_week' %}">This Week</a>

</html>
